<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolirana Admin - Control de Configuración y Sensores</title>
  <meta name="description" content="Panel de administración de Bolirana FUTSPO para configurar variables de juego, precios, simular sensores y monitorear el estado del arcade en tiempo real.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080815;
      --card:rgba(22, 22, 40, 0.7);
      --border:rgba(0, 240, 255, 0.2);
      --border-focus:rgba(0, 240, 255, 0.6);
      --neon:#00f0ff;
      --gold:#f0e000;
      --text:#e0e0ff;
      --muted:#8b9bb4;
      --green:#00ffaa;
      --red:#ff0055;
      --glow:rgba(0, 240, 255, 0.25);
    }
    body{
      font-family:'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 50%, #12122b 0%, var(--bg) 100%);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }
    header{
      background: rgba(13, 13, 26, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      padding:16px 32px;
      display:flex;
      align-items:center;
      gap:16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .logo{
      font-family:'Share Tech Mono', monospace;
      font-size:24px;
      font-weight: 800;
      color:var(--neon);
      letter-spacing:6px;
      text-shadow: 0 0 10px rgba(0,240,255,0.5);
    }
    .badge{
      font-size:12px;
      color:var(--gold);
      letter-spacing:3px;
      font-weight: 600;
      border: 1px solid rgba(240,224,0,0.3);
      padding: 2px 8px;
      border-radius: 4px;
      text-shadow: 0 0 5px rgba(240,224,0,0.3);
    }
    main{max-width:1100px;margin:0 auto;padding:32px 24px;display:grid;gap:24px}
    .tabs{
      display:flex;
      gap:8px;
      border-bottom:2px solid var(--border);
      margin-bottom:8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar {
      height: 4px;
    }
    .tabs::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .tab{
      padding:12px 24px;
      background:transparent;
      border:none;
      color:var(--muted);
      cursor:pointer;
      font-size:14px;
      font-weight: 600;
      letter-spacing:1.5px;
      border-bottom:3px solid transparent;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .tab:hover{
      color: var(--neon);
      text-shadow: 0 0 8px rgba(0,240,255,0.4);
    }
    .tab.active{
      color:var(--neon);
      border-bottom-color:var(--neon);
      text-shadow: 0 0 10px rgba(0,240,255,0.6);
    }
    .panel{display:none; animation: fadeIn 0.4s ease-out forwards;}
    .panel.active{display:block}
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card{
      background:var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border:1px solid var(--border);
      border-radius:12px;
      padding:24px;
      margin-bottom:20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: border-color 0.3s;
    }
    .card:hover {
      border-color: rgba(0, 240, 255, 0.35);
    }
    .card-title{
      font-family:'Share Tech Mono', monospace;
      font-size:15px;
      font-weight: 800;
      letter-spacing:2.5px;
      color:var(--gold);
      margin-bottom:20px;
      text-transform: uppercase;
      border-left: 4px solid var(--gold);
      padding-left: 10px;
    }
    label{
      font-size:12px;
      font-weight: 600;
      color:var(--muted);
      display:block;
      margin-bottom:6px;
      letter-spacing:1px;
      text-transform: uppercase;
    }
    input[type=number],input[type=text],select{
      background:rgba(0, 0, 0, 0.45);
      border:1px solid var(--border);
      color:var(--text);
      padding:10px 14px;
      border-radius:8px;
      font-size:14px;
      font-family: inherit;
      width:100%;
      outline:none;
      transition:all 0.3s;
    }
    input:focus,select:focus{
      border-color:var(--neon);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
      background:rgba(0, 0, 0, 0.6);
    }
    .form-row{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:16px;
      margin-bottom:16px;
    }
    .btn{
      padding:12px 24px;
      border:none;
      border-radius:8px;
      font-size:14px;
      font-weight: 700;
      cursor:pointer;
      letter-spacing:1.5px;
      font-family: inherit;
      transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
    }
    .btn-save{
      background: linear-gradient(135deg, var(--neon), #00a8ff);
      color:#000;
      box-shadow: 0 4px 15px rgba(0,240,255,0.3);
    }
    .btn-save:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,240,255,0.5);
      filter: brightness(1.1);
    }
    .btn-save:active{
      transform: translateY(0);
    }
    .btn-danger{
      background: linear-gradient(135deg, var(--red), #cc0044);
      color:#fff;
      box-shadow: 0 4px 15px rgba(255,0,85,0.3);
    }
    .btn-danger:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,0,85,0.5);
    }
    .btn-sim{
      background:rgba(0,255,170,0.06);
      color:var(--green);
      border:1px solid rgba(0,255,170,0.3);
    }
    .btn-sim:hover{
      background:rgba(0,255,170,0.15);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(0,255,170,0.25);
      transform: translateY(-1px);
    }
    .sensor-row{
      display:grid;
      grid-template-columns:1fr 2.5fr 1.2fr 100px;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid rgba(255, 255, 255, 0.05);
    }
    .sensor-row:last-child{border:none}
    .sensor-id{
      font-family:'Share Tech Mono', monospace;
      font-size:13px;
      color:var(--neon);
      font-weight: bold;
    }
    .toggle{
      width:54px;
      height:26px;
      border-radius:13px;
      border:none;
      cursor:pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      transition:all 0.3s;
      background:rgba(255,255,255,0.15);
      color: #fff;
    }
    .toggle.on{
      background:var(--green);
      color:#000;
      box-shadow: 0 0 8px rgba(0,255,170,0.4);
    }
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .stat-card{
      background:rgba(255,255,255,0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius:10px;
      padding:20px;
      text-align:center;
      transition: all 0.3s;
    }
    .stat-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--neon);
    }
    .stat-num{
      font-family:'Share Tech Mono', monospace;
      font-size:32px;
      font-weight:800;
      color:var(--neon);
      text-shadow: 0 0 10px rgba(0,240,255,0.3);
    }
    .stat-lbl{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
    .sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .toast{
      position:fixed;
      bottom:32px;
      right:32px;
      background: linear-gradient(135deg, var(--green), #00cc88);
      color:#000;
      font-weight: 700;
      letter-spacing: 1px;
      padding:12px 28px;
      border-radius:10px;
      font-size:14px;
      box-shadow: 0 10px 30px rgba(0,255,170,0.35);
      opacity:0;
      transform: translateY(20px);
      transition:all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    .toast.show{opacity:1;transform:translateY(0)}
  </style>
</head>
<body>
<header>
  <span class="logo">BOLIRANA</span>
  <span class="badge">PANEL ADMIN</span>
  <span id="status-badge" style="margin-left:auto;font-size:12px;color:var(--muted)">⚙ cargando...</span>
</header>
<main>
  <div class="tabs">
    <button class="tab active" data-tab="juego">JUEGO</button>
    <button class="tab" data-tab="sensores">SENSORES</button>
    <button class="tab" data-tab="precios">PRECIOS</button>
    <button class="tab" data-tab="simulador">SIMULADOR</button>
    <button class="tab" data-tab="stats">ESTADO</button>
  </div>

  <!-- ── JUEGO ── -->
  <div id="panel-juego" class="panel active">
    <div class="card">
      <div class="card-title">CONFIGURACIÓN DE PARTIDA</div>
      <div class="form-row">
        <div><label>Bolas por jugador (default)</label>
          <input type="number" id="cfg-balls" min="1" max="20" value="5"></div>
        <div><label>Tiempo límite (segundos, modo TIMED)</label>
          <input type="number" id="cfg-time" min="30" max="600" value="120"></div>
        <div><label>Segundos entre turnos</label>
          <input type="number" id="cfg-turn" min="2" max="10" value="4"></div>
        <div><label>Segundos attract timeout</label>
          <input type="number" id="cfg-attract" min="10" max="300" value="30"></div>
        <div><label>Modalidad de Tiro</label>
          <select id="cfg-rotation">
            <option value="sequential">Secuencial (todas las bolas juntas)</option>
            <option value="alternate">Alternado (1 bola cada uno)</option>
          </select></div>
      </div>
      <button class="btn btn-save" id="save-game">GUARDAR JUEGO</button>
    </div>
  </div>

  <!-- ── SENSORES ── -->
  <div id="panel-sensores" class="panel">
    <div class="card">
      <div class="card-title">ZONAS DE PUNTAJE</div>
      <div id="sensor-list"></div>
      <button class="btn btn-save" id="save-sensors" style="margin-top:12px">GUARDAR SENSORES</button>
    </div>
  </div>

  <!-- ── PRECIOS ── -->
  <div id="panel-precios" class="panel">
    <div class="card">
      <div class="card-title">SISTEMA DE CRÉDITOS</div>
      <div class="form-row">
        <div><label>Créditos por ficha</label>
          <input type="number" id="pr-coin" min="1" max="10" value="1"></div>
        <div><label>Pesos por crédito (QR)</label>
          <input type="number" id="pr-pesos" min="50" max="5000" value="200"></div>
        <div><label>Créditos base por jugador</label>
          <input type="number" id="pr-base" min="1" max="5" value="1"></div>
      </div>
      <div class="card-title" style="margin-top:16px">EXTRA POR MODO</div>
      <div class="form-row">
        <div><label>Clásico</label><input type="number" id="pr-classic" value="0" min="0"></div>
        <div><label>Contrarreloj</label><input type="number" id="pr-timed" value="0" min="0"></div>
        <div><label>Batalla</label><input type="number" id="pr-battle" value="1" min="0"></div>
        <div><label>Equipo</label><input type="number" id="pr-team" value="0" min="0"></div>
      </div>
      <button class="btn btn-save" id="save-pricing">GUARDAR PRECIOS</button>
    </div>
  </div>

  <!-- ── SIMULADOR ── -->
  <div id="panel-simulador" class="panel">
    <div class="card">
      <div class="card-title">SIMULAR EVENTOS (sin hardware)</div>
      <div class="sim-grid" id="sim-sensors"></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-sim" onclick="simAction('/api/sim/coin')">💰 +1 FICHA</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/ok')">▶ BOTÓN OK</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/next')">► NEXT</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/prev')">◄ PREV</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/start')">● START</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/pause')">⏸ PAUSE</button>
        <button class="btn btn-sim" onclick="simAction('/api/sim/button/back')">◄ BACK</button>
      </div>
    </div>
  </div>

  <!-- ── ESTADO ── -->
  <div id="panel-stats" class="panel">
    <div class="card">
      <div class="card-title">ESTADO EN TIEMPO REAL</div>
      <div class="stat-grid" id="stat-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">ESTADO JSON</div>
      <pre id="state-json" style="font-size:11px;color:var(--muted);overflow:auto;max-height:300px"></pre>
    </div>
  </div>
</main>

<div class="toast" id="toast">✓ Guardado</div>

<script>
// ── API helpers ───────────────────────────────────────────────────────────────
async function api(path, method="GET", body=null) {
  const opts = { method, headers: {"Content-Type":"application/json"} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}
async function simAction(path) {
  await api(path, "POST");
  toast("Evento enviado");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = "✓ " + msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-" + t.dataset.tab).classList.add("active");
  });
});

// ── Cargar config ─────────────────────────────────────────────────────────────
let cfg = {};
async function loadConfig() {
  cfg = await api("/api/admin/config");
  const g = cfg.game || {};
  document.getElementById("cfg-balls").value   = g.balls_default || 5;
  document.getElementById("cfg-time").value    = g.time_limit_seconds || 120;
  document.getElementById("cfg-turn").value    = g.turn_change_seconds || 4;
  document.getElementById("cfg-attract").value = g.attract_timeout_seconds || 30;
  document.getElementById("cfg-rotation").value = g.rotation_mode || "sequential";

  const p = cfg.pricing || {};
  document.getElementById("pr-coin").value    = p.coin_to_credits || 1;
  document.getElementById("pr-pesos").value   = p.pesos_per_credit || 200;
  document.getElementById("pr-base").value    = p.base_credits_per_player || 1;
  document.getElementById("pr-classic").value = p.mode_extra?.classic || 0;
  document.getElementById("pr-timed").value   = p.mode_extra?.timed || 0;
  document.getElementById("pr-battle").value  = p.mode_extra?.battle || 1;
  document.getElementById("pr-team").value    = p.mode_extra?.team || 0;

  renderSensors(cfg.sensors || []);
  renderSimSensors(cfg.sensors || []);
}

function renderSensors(sensors) {
  const wrap = document.getElementById("sensor-list");
  wrap.innerHTML = sensors.map((s, i) => `
    <div class="sensor-row">
      <span class="sensor-id">${s.id}</span>
      <input type="text" value="${s.name}" id="sn-${i}-name" placeholder="Nombre">
      <input type="number" value="${s.points}" id="sn-${i}-pts" min="0" max="9999">
      <button class="toggle ${s.enabled?"on":""}" id="sn-${i}-en"
        onclick="toggleSensor(${i},this)">${s.enabled?"ON":"OFF"}</button>
    </div>`).join("");
}

function toggleSensor(i, btn) {
  const on = !btn.classList.contains("on");
  btn.classList.toggle("on", on);
  btn.textContent = on ? "ON" : "OFF";
}

function renderSimSensors(sensors) {
  const wrap = document.getElementById("sim-sensors");
  wrap.innerHTML = sensors.filter(s=>s.enabled).map(s =>
    `<button class="btn btn-sim" onclick="simAction('/api/sim/sensor/${s.id}')">
      🎯 ${s.name}
    </button>`).join("");
}

// ── Guardar ───────────────────────────────────────────────────────────────────
document.getElementById("save-game").addEventListener("click", async () => {
  await api("/api/admin/config/game", "PATCH", {
    balls_default:          +document.getElementById("cfg-balls").value,
    time_limit_seconds:     +document.getElementById("cfg-time").value,
    turn_change_seconds:    +document.getElementById("cfg-turn").value,
    attract_timeout_seconds:+document.getElementById("cfg-attract").value,
    rotation_mode:          document.getElementById("cfg-rotation").value,
  });
  toast("Configuración de juego guardada");
});

document.getElementById("save-pricing").addEventListener("click", async () => {
  await api("/api/admin/config/pricing", "PATCH", {
    coin_to_credits:       +document.getElementById("pr-coin").value,
    pesos_per_credit:      +document.getElementById("pr-pesos").value,
    base_credits_per_player:+document.getElementById("pr-base").value,
    mode_extra: {
      classic:+document.getElementById("pr-classic").value,
      timed:  +document.getElementById("pr-timed").value,
      battle: +document.getElementById("pr-battle").value,
      team:   +document.getElementById("pr-team").value,
    }
  });
  toast("Precios guardados");
});

document.getElementById("save-sensors").addEventListener("click", async () => {
  const sensors = (cfg.sensors||[]).map((s, i) => ({
    ...s,
    name:    document.getElementById(`sn-${i}-name`)?.value || s.name,
    points:  +document.getElementById(`sn-${i}-pts`)?.value || s.points,
    enabled: document.getElementById(`sn-${i}-en`)?.classList.contains("on"),
  }));
  await api("/api/admin/config/sensors", "PATCH", sensors);
  cfg.sensors = sensors;
  renderSimSensors(sensors);
  toast("Sensores guardados");
});

// ── Stats polling ─────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const s = await api("/api/admin/stats");
    document.getElementById("status-badge").textContent =
      `Estado: ${s.state} | Display: ${s.display_on?"✓":"✗"} | Phones: ${s.phones_connected}`;
    const grid = document.getElementById("stat-grid");
    grid.innerHTML = `
      <div class="stat-card"><div class="stat-num">${s.state}</div><div class="stat-lbl">ESTADO</div></div>
      <div class="stat-card"><div class="stat-num">${s.players?.length||0}</div><div class="stat-lbl">JUGADORES</div></div>
      <div class="stat-card"><div class="stat-num">${s.phones_connected}</div><div class="stat-lbl">CELULARES</div></div>
      <div class="stat-card"><div class="stat-num">${s.display_on?"ON":"OFF"}</div><div class="stat-lbl">DISPLAY</div></div>`;

    const fullState = await api("/api/state");
    document.getElementById("state-json").textContent = JSON.stringify(fullState, null, 2);
  } catch(e){}
}

loadConfig();
loadStats();
setInterval(loadStats, 3000);
</script>
</body>
</html>
